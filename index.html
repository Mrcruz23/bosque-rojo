<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bosque Rojo — Filtro</title>
<meta name="theme-color" content="#0a0000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root{
    --blood: #c40412;
    --ember: #ff2d1a;
    --void: #060202;
    --ash: #7a6a68;
    --ui-glass: rgba(10,4,4,0.55);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--void); overflow:hidden;
    font-family:'Courier New', ui-monospace, monospace;
    color:#e8d9d6;
  }
  #stage{
    position:fixed; inset:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    background:#000;
  }
  canvas#glcanvas{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  video#srcVideo, video#fileVideo{ display:none; }

  /* Top status bar */
  #topbar{
    position:fixed; top:0; left:0; right:0;
    padding:calc(env(safe-area-inset-top) + 14px) 18px 10px;
    display:flex; justify-content:space-between; align-items:center;
    z-index:10; pointer-events:none;
    background:linear-gradient(to bottom, rgba(0,0,0,0.65), transparent);
  }
  #brand{
    font-size:11px; letter-spacing:0.25em; text-transform:uppercase;
    color:var(--ember); opacity:0.85; font-weight:bold;
  }
  #brand span{ color:#5a4442; }
  #recIndicator{
    display:flex; align-items:center; gap:6px;
    font-size:12px; letter-spacing:0.1em; color:#ff5544;
    opacity:0; transition:opacity 0.2s;
  }
  #recIndicator.active{ opacity:1; }
  #recDot{
    width:9px; height:9px; border-radius:50%; background:#ff2d1a;
    animation:pulse 1s infinite ease-in-out;
    box-shadow:0 0 8px #ff2d1a;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  /* Bottom controls */
  #bottombar{
    position:fixed; bottom:0; left:0; right:0;
    padding:16px 20px calc(env(safe-area-inset-bottom) + 20px);
    z-index:10;
    background:linear-gradient(to top, rgba(0,0,0,0.75), transparent);
  }
  #paramRow{
    display:flex; gap:8px; overflow-x:auto; margin-bottom:14px;
    padding-bottom:2px; scrollbar-width:none;
  }
  #paramRow::-webkit-scrollbar{ display:none; }
  .chip{
    flex:0 0 auto; padding:7px 13px; border-radius:3px;
    background:var(--ui-glass); border:1px solid rgba(196,4,18,0.4);
    font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:#c9b6b3; white-space:nowrap; cursor:pointer;
  }
  .chip.selected{
    background:rgba(196,4,18,0.35); border-color:var(--ember); color:#fff;
  }
  #presetRow{
    display:flex; gap:8px; overflow-x:auto; margin-bottom:10px;
    padding-bottom:2px; scrollbar-width:none;
  }
  #presetRow::-webkit-scrollbar{ display:none; }
  .presetChip{
    flex:0 0 auto; padding:8px 14px; border-radius:3px;
    background:rgba(10,14,14,0.55); border:1px solid rgba(150,220,230,0.35);
    font-size:10px; letter-spacing:0.1em; text-transform:uppercase;
    color:#b9d8dc; white-space:nowrap; cursor:pointer; font-weight:bold;
  }
  .presetChip.selected{
    background:rgba(150,220,230,0.22); border-color:#d8f4f7; color:#fff;
  }
  #sliderWrap{
    display:none; align-items:center; gap:10px; margin-bottom:14px;
    background:var(--ui-glass); padding:10px 14px; border-radius:4px;
    border:1px solid rgba(196,4,18,0.3);
  }
  #sliderWrap.show{ display:flex; }
  #sliderLabel{ font-size:10px; letter-spacing:0.1em; color:var(--ash); width:70px; text-transform:uppercase;}
  #sliderInput{ flex:1; accent-color:var(--ember); }

  #controlsRow{
    display:flex; align-items:center; justify-content:space-between;
  }
  .iconBtn{
    width:46px; height:46px; border-radius:50%;
    background:var(--ui-glass); border:1px solid rgba(196,4,18,0.4);
    display:flex; align-items:center; justify-content:center;
    font-size:19px; color:#e8d9d6; cursor:pointer;
  }
  .iconBtn:active{ background:rgba(196,4,18,0.4); }

  #shutterBtn{
    width:74px; height:74px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #ff4433, #a30410 70%);
    border:4px solid rgba(255,255,255,0.85);
    box-shadow:0 0 22px rgba(196,4,18,0.65);
    cursor:pointer;
  }
  #shutterBtn.recording{
    background:#111; border-color:#ff2d1a;
  }
  #shutterBtn.recording::after{
    content:''; display:block; width:22px; height:22px; margin:auto;
    background:#ff2d1a; border-radius:4px;
  }
  #videoBtn{
    font-size:16px; color:#ff5544;
  }
  #videoBtn.recording{
    background:#ff2d1a; border-color:#fff; color:#fff;
  }
  #torchBtn{
    font-size:17px; color:#ffd966;
  }
  #torchBtn.active{
    background:rgba(255,217,102,0.35); border-color:#ffd966; color:#fff;
  }

  #hint{
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    color:rgba(232,217,214,0.5); font-size:12px; letter-spacing:0.15em;
    text-transform:uppercase; z-index:5; text-align:center; pointer-events:none;
    display:none;
  }
  #hint.show{ display:block; }

  #importBar{
    position:fixed; top:0; left:0; right:0; bottom:0;
    z-index:20; background:rgba(3,1,1,0.92);
    display:none; align-items:center; justify-content:center; flex-direction:column;
    gap:18px; padding:24px;
  }
  #importBar.show{ display:flex; }
  #importBar p{ font-size:12px; letter-spacing:0.1em; color:var(--ash); text-align:center; max-width:280px;}
  #exportProgress{
    width:220px; height:3px; background:rgba(196,4,18,0.2); border-radius:2px; overflow:hidden;
  }
  #exportProgressFill{
    height:100%; width:0%; background:var(--ember); transition:width 0.15s linear;
  }
  .bigBtn{
    padding:13px 26px; border-radius:3px; border:1px solid var(--ember);
    background:rgba(196,4,18,0.15); color:#fff; font-size:12px;
    letter-spacing:0.1em; text-transform:uppercase; cursor:pointer;
    font-family:inherit;
  }
  .bigBtn:active{ background:rgba(196,4,18,0.4); }

  #installToast{
    position:fixed; left:50%; bottom:110px; transform:translateX(-50%);
    background:rgba(10,3,3,0.92); border:1px solid var(--ember);
    padding:10px 16px; border-radius:4px; font-size:11px; letter-spacing:0.06em;
    color:#e8d9d6; z-index:30; display:none; white-space:nowrap;
  }
  #installToast.show{ display:block; }
</style>
</head>
<body>

<div id="stage">
  <canvas id="glcanvas"></canvas>
  <video id="srcVideo" playsinline muted autoplay></video>
  <video id="fileVideo" playsinline muted></video>
</div>

<div id="hint">Iniciando cámara…</div>

<div id="topbar">
  <div id="brand">Bosque<span>_</span>Rojo</div>
  <div id="recIndicator"><div id="recDot"></div>REC <span id="recTime">00:00</span></div>
</div>

<div id="bottombar">
  <div id="presetRow">
    <div class="presetChip selected" data-preset="0">Sangre</div>
    <div class="presetChip" data-preset="1">Cian/Rojo</div>
    <div class="presetChip" data-preset="2">Ascuas</div>
    <div class="presetChip" data-preset="3">Amanecer</div>
  </div>

  <div id="paramRow">
    <div class="chip selected" data-param="intensity">Rojo</div>
    <div class="chip" data-param="glow">Brillos</div>
    <div class="chip" data-param="darkness">Sombra</div>
    <div class="chip" data-param="vignette">Viñeta</div>
    <div class="chip" data-param="grain">Ruido</div>
  </div>

  <div id="sliderWrap">
    <div id="sliderLabel">Rojo</div>
    <input type="range" id="sliderInput" min="0" max="100" value="70">
  </div>

  <div id="controlsRow">
    <div class="iconBtn" id="flipBtn" title="Cambiar cámara">⟲</div>
    <div class="iconBtn" id="torchBtn" title="Flash" style="display:none;">⚡</div>
    <div id="shutterBtn" title="Tomar foto"></div>
    <div class="iconBtn" id="videoBtn" title="Grabar video">●</div>
    <div class="iconBtn" id="importBtn" title="Importar video">⇪</div>
  </div>
</div>

<input type="file" id="fileInput" accept="video/*" style="display:none">

<div id="importBar">
  <p id="importStatus">Procesando video con el filtro…</p>
  <div id="exportProgress"><div id="exportProgressFill"></div></div>
  <div class="bigBtn" id="cancelImport" style="display:none;">Cancelar</div>
  <a id="downloadLink" class="bigBtn" style="display:none; text-decoration:none;" download="bosque-rojo.mp4">Descargar video</a>
  <div class="bigBtn" id="closeImportBtn" style="display:none;">Volver a cámara</div>
</div>

<div id="installToast">Instalá esta app: menú del navegador → "Agregar a pantalla de inicio"</div>

<script>
// ============================================================
// BOSQUE ROJO — Filtro de video estilo "human_antithesis"
// Duotono negro/rojo + viñeta central oscura + ruido brillante
// enmascarado en zonas oscuras verticales (troncos)
// ============================================================

const canvas = document.getElementById('glcanvas');
const gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false }) ||
           canvas.getContext('experimental-webgl', { preserveDrawingBuffer: true });

const srcVideo = document.getElementById('srcVideo');
const fileVideo = document.getElementById('fileVideo');
const hint = document.getElementById('hint');

let usingFileSource = false;
let activeVideo = srcVideo;

// ---------- Shader ----------
const vertSrc = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  vUv.y = 1.0 - vUv.y;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
`;

const fragSrc = `
precision highp float;
varying vec2 vUv;
uniform sampler2D uTex;
uniform float uTime;
uniform float uIntensity;   // duotone red strength
uniform float uDarkness;    // shadow crush
uniform float uGlow;        // trunk noise glow amount
uniform float uVignette;    // center darkening amount
uniform float uGrain;       // fine grain
uniform float uPreset;      // 0=Sangre 1=Cian/Rojo 2=Ascuas 3=Amanecer
uniform vec2  uResolution;

float hash(vec2 p){
  // Keep inputs bounded so precision holds even when the driver falls back
  // to mediump on mobile GPUs (highp fragment support isn't guaranteed).
  p = mod(p, 289.0);
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}
float noise(vec2 p){
  vec2 i = floor(p);
  vec2 f = fract(p);
  float a = hash(i);
  float b = hash(i + vec2(1.0,0.0));
  float c = hash(i + vec2(0.0,1.0));
  float d = hash(i + vec2(1.0,1.0));
  vec2 u = f*f*(3.0-2.0*f);
  return mix(a,b,u.x) + (c-a)*u.y*(1.0-u.x) + (d-b)*u.x*u.y;
}
float fbm(vec2 p){
  // 3 octaves instead of 4: noticeably cheaper per-pixel on mobile GPUs
  // while keeping the fine sparkle texture the trunks need.
  float v = 0.0;
  float amp = 0.5;
  for(int i=0;i<3;i++){
    v += amp * noise(p);
    p *= 2.02;
    amp *= 0.5;
  }
  return v;
}

// Worley/cellular noise: distance to nearest random point per grid cell.
// Gives the crisp, cell-like clumping seen in Blender's Voronoi/Noise Texture
// nodes — sharper and more "clustered" than smooth fbm blobs.
float worley(vec2 p){
  vec2 cell = floor(p);
  vec2 f = fract(p);
  float minDist = 1.5;
  for(int y=-1; y<=1; y++){
    for(int x=-1; x<=1; x++){
      vec2 neighbor = vec2(float(x), float(y));
      vec2 cellId = cell + neighbor;
      // Feature point randomly placed inside this neighboring cell (0..1 range).
      vec2 featurePoint = vec2(hash(cellId), hash(cellId + vec2(17.0, 41.0)));
      vec2 diff = neighbor + featurePoint - f;
      float dist = length(diff);
      minDist = min(minDist, dist);
    }
  }
  return minDist;
}

// Luminance-gradient edge detection (lightweight Sobel-style): samples the
// source texture around the pixel and returns how sharply luminance changes
// there. Used by "Ascuas" to trace branch/trunk silhouette contours instead
// of filling whole dark regions.
float edgeStrength(sampler2D tex, vec2 uv, vec2 texel){
  float tl = dot(texture2D(tex, uv + texel*vec2(-1.0,-1.0)).rgb, vec3(0.299,0.587,0.114));
  float t  = dot(texture2D(tex, uv + texel*vec2( 0.0,-1.0)).rgb, vec3(0.299,0.587,0.114));
  float tr = dot(texture2D(tex, uv + texel*vec2( 1.0,-1.0)).rgb, vec3(0.299,0.587,0.114));
  float l  = dot(texture2D(tex, uv + texel*vec2(-1.0, 0.0)).rgb, vec3(0.299,0.587,0.114));
  float r  = dot(texture2D(tex, uv + texel*vec2( 1.0, 0.0)).rgb, vec3(0.299,0.587,0.114));
  float bl = dot(texture2D(tex, uv + texel*vec2(-1.0, 1.0)).rgb, vec3(0.299,0.587,0.114));
  float b  = dot(texture2D(tex, uv + texel*vec2( 0.0, 1.0)).rgb, vec3(0.299,0.587,0.114));
  float br = dot(texture2D(tex, uv + texel*vec2( 1.0, 1.0)).rgb, vec3(0.299,0.587,0.114));
  float gx = (tr + 2.0*r + br) - (tl + 2.0*l + bl);
  float gy = (bl + 2.0*b + br) - (tl + 2.0*t + tr);
  return length(vec2(gx, gy));
}

void main(){
  vec2 uv = vUv;
  vec4 srcColor = texture2D(uTex, uv);
  float lum = dot(srcColor.rgb, vec3(0.299, 0.587, 0.114));

  // --- Duotone curve: crush blacks, push mids/highs to a preset color pair ---
  float crushed = pow(lum, 1.0 + uDarkness * 2.2);
  float redAmount = smoothstep(0.02, 0.55, crushed);

  int presetId = int(uPreset + 0.5);
  vec3 shadowColor;
  vec3 highColor;
  vec3 warmPush;
  vec3 duotone;

  if(presetId == 2){
    // "Ascuas" — structurally different: near-desaturated grey/blue base
    // (not a color duotone). Color comes later, traced along edges only.
    vec3 desat = vec3(lum) * vec3(0.62, 0.66, 0.7);
    float crushedGrey = pow(lum, 1.0 + uDarkness * 1.6);
    duotone = mix(desat * 0.4, desat, crushedGrey);
  } else if(presetId == 1){
    // "Cian / Rojo" — teal/cyan should DOMINATE across mids and shadows,
    // with hot red/pink only breaking through in the brightest highlights
    // (ref. image 1). Both colors pushed brighter/more saturated than the
    // first pass, and red pushed as intense as (slightly more than) Sangre's
    // red — not a softer pink.
    // IMPORTANT: multiply the mapped color by luminance (not just mix toward
    // a flat color pair) so brighter and darker areas of the real scene stay
    // visually distinct at high uIntensity — otherwise everything collapses
    // toward the same flat tone and shapes/forms disappear.
    shadowColor = vec3(0.0, 0.85, 0.92);
    highColor = vec3(0.95, 0.02, 0.03);
    warmPush = vec3(0.0, 0.16, 0.17);
    float cyanRedAmount = smoothstep(0.35, 0.85, crushed);
    vec3 mappedColor = mix(shadowColor, highColor, cyanRedAmount);
    // Scale by a lifted luminance curve so texture/shape detail survives.
    float lumShaped = mix(0.35, 1.0, crushed);
    vec3 coloredScene = mappedColor * lumShaped;
    duotone = mix(vec3(lum), coloredScene, uIntensity);
    duotone += warmPush * (1.0 - cyanRedAmount);
  } else if(presetId == 3){
    // "Amanecer" — warm amber/gold highlights over a muted brown-grey base (ref. image 4)
    shadowColor = vec3(0.02, 0.015, 0.02);
    highColor = vec3(0.95, 0.55, 0.15);
    warmPush = vec3(0.025, 0.015, 0.005);
    duotone = mix(shadowColor, highColor, redAmount);
    duotone = mix(vec3(lum), duotone, uIntensity);
    duotone += warmPush * (1.0 - redAmount);
  } else {
    // "Sangre" (default) — near-black shadows, blood/ember red highlights
    shadowColor = vec3(0.0, 0.0, 0.0);
    highColor = vec3(0.85, 0.05, 0.05);
    warmPush = vec3(0.03, 0.0, 0.0);
    duotone = mix(shadowColor, highColor, redAmount);
    duotone = mix(vec3(lum), duotone, uIntensity);
    duotone += warmPush * (1.0 - redAmount);
  }

  // --- Vignette: darken the center-ish where silhouettes usually are ---
  vec2 centered = (uv - 0.5) * vec2(uResolution.x/uResolution.y, 1.0);
  float distToCenterBand = abs(centered.y + 0.05);
  float bandMask = smoothstep(0.55, 0.05, distToCenterBand);
  float edgeVign = smoothstep(0.95, 0.35, length(centered));
  float vign = mix(1.0, mix(1.0, 0.15, bandMask), uVignette) * mix(1.0, edgeVign, uVignette*0.6);
  duotone *= mix(1.0, vign, uVignette);

  // --- Glowing noise masked onto dark, vertical (trunk-like) areas ---
  // Tighter luminance window: only the deepest shadows qualify, so in a very
  // dark room the whole frame doesn't light up uniformly — only true blacks do.
  float darkMask = 1.0 - smoothstep(0.01, 0.18, lum);
  // Loop time so it never grows unbounded across a long session (bounded inputs
  // keep hash() accurate even under mediump precision).
  float loopedTime = mod(uTime, 1000.0);

  if(presetId == 2){
    // "Ascuas" — structurally different glow: trace branch/trunk CONTOURS
    // with glinting red, plus a faint translucent cyan halo just outside
    // those edges (ref. image 3), instead of filling dark pockets.
    vec2 texel = 1.0 / uResolution.xy;
    float edge = edgeStrength(uTex, uv, texel * 1.6);
    float edgeMask = smoothstep(0.2, 0.5, edge);

    // Break the traced line up into glinting segments rather than one
    // continuous outline, using the same cellular noise as elsewhere.
    vec2 edgeNoiseUv = uv * vec2(uResolution.x/uResolution.y, 1.0) * 30.0 + vec2(0.0, loopedTime * 0.5);
    float en = worley(edgeNoiseUv);
    float edgeGlint = pow(clamp(1.0 - en * 2.2, 0.0, 1.0), 1.6);

    // "Brillo rojo" (uIntensity) controls ONLY the red edge glow.
    // "Brillo cian" (uGlow) controls ONLY the cyan halo.
    // Kept fully independent so turning either down to 0 leaves the other
    // untouched — previously both were multiplied by uGlow, so zeroing the
    // cyan control silently killed the red too.
    float redEdge = edgeMask * mix(0.35, 1.0, edgeGlint) * uIntensity;
    vec3 redEdgeColor = vec3(1.0, 0.06, 0.05);
    duotone += redEdgeColor * redEdge * 2.4;

    // Faint translucent cyan bleeding just outside the red edge — sample
    // edge strength slightly further out to approximate an outer halo.
    float edgeOuter = edgeStrength(uTex, uv, texel * 3.2);
    float haloMask = smoothstep(0.12, 0.35, edgeOuter) * (1.0 - edgeMask);
    vec3 haloColor = vec3(0.15, 0.55, 0.55);
    duotone += haloColor * haloMask * uGlow * 0.5;
  } else {
    // Cellular/Worley noise (like Blender's Noise/Voronoi texture) instead of
    // fbm: gives crisp, isolated glinting cells rather than soft organic blobs.
    // Oscillating offset (sin) instead of a constant linear drift — a steady
    // upward crawl reads as "the glow is scrolling", while oscillation reads
    // as flickering in place, which is what glitter/sparkle should do.
    // Sangre specifically uses a higher cell frequency (smaller, denser
    // points) per request — other presets keep the original spacing.
    float cellFreq = (presetId == 0) ? 58.0 : 42.0;
    vec2 worleyUv = uv * vec2(uResolution.x/uResolution.y, 1.0) * cellFreq + vec2(0.0, sin(loopedTime * 0.18) * 1.2);
    float w = worley(worleyUv);
    // Small, fast-drifting second layer so points glint/flicker over time.
    float wFlicker = worley(worleyUv * 2.3 + sin(loopedTime * 0.35 + 5.0) * 1.5);
    // Distance near 0 = right at a cell's feature point = brightest, sharp falloff.
    // mult=8 / pow=4 keeps it sparse — isolated glinting cells, not a dense net.
    // Sangre uses a slightly gentler mult so the smaller/denser cells still
    // read as visible points rather than disappearing entirely.
    float sparkleMult = (presetId == 0) ? 6.0 : 8.0;
    float sparkle = pow(clamp(1.0 - w * sparkleMult, 0.0, 1.0), 4.0);
    sparkle *= mix(0.5, 1.0, clamp(1.0 - wFlicker * 2.0, 0.0, 1.0));
    float glowMask = darkMask * sparkle * uGlow;

    vec3 glowColor;
    float glowStrength;
    if(presetId == 3){
      // "Amanecer" — warm red/ember glow on the trunk (ref. image 4)
      glowColor = vec3(1.0, 0.15, 0.05);
      glowStrength = 2.6;
    } else {
      // "Sangre" and "Cian/Rojo" — near-white, pale cyan/ice glow
      glowColor = vec3(0.85, 0.97, 1.0);
      glowStrength = 2.4;
    }
    duotone += glowColor * glowMask * glowStrength;
  }

  // --- Fine grain / "Ruido" ---
  // Block-based noise (several device pixels per cell) instead of 1:1 pixel
  // noise — true per-pixel noise is often too fine to read on a phone screen
  // at normal viewing distance/compression. Also boosted range so the effect
  // is unmistakable rather than needing to be hunted for.
  vec2 grainCell = floor(uv * uResolution.xy / 2.2);
  float gRaw = hash(grainCell + loopedTime * 60.0) - 0.5; // -0.5..0.5
  float g = gRaw * uGrain * 0.6;
  duotone += vec3(g);

  gl_FragColor = vec4(clamp(duotone, 0.0, 1.0), 1.0);
}
`;

function compileShader(src, type){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    console.error(gl.getShaderInfoLog(s));
  }
  return s;
}
const vShader = compileShader(vertSrc, gl.VERTEX_SHADER);
const fShader = compileShader(fragSrc, gl.FRAGMENT_SHADER);
const program = gl.createProgram();
gl.attachShader(program, vShader);
gl.attachShader(program, fShader);
gl.linkProgram(program);
gl.useProgram(program);

const posBuf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, posBuf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(program, 'aPos');
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uTex = gl.getUniformLocation(program, 'uTex');
const uTime = gl.getUniformLocation(program, 'uTime');
const uIntensity = gl.getUniformLocation(program, 'uIntensity');
const uDarkness = gl.getUniformLocation(program, 'uDarkness');
const uGlow = gl.getUniformLocation(program, 'uGlow');
const uVignette = gl.getUniformLocation(program, 'uVignette');
const uGrain = gl.getUniformLocation(program, 'uGrain');
const uPreset = gl.getUniformLocation(program, 'uPreset');
const uResolution = gl.getUniformLocation(program, 'uResolution');

const texture = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, texture);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

// ---------- Params (0..1 internal) ----------
const params = {
  intensity: 0.7,
  darkness: 0.55,
  glow: 0.55,
  vignette: 0.5,
  grain: 0.3
};
// Label for the "intensity" slider changes meaning per preset, since what
// Label for the "intensity" slider changes meaning per preset, since what
// uIntensity actually drives is different in each one (color mix strength
// in Sangre/Cian-Rojo/Amanecer, red edge glow strength in Ascuas).
const intensityLabelByPreset = {
  0: 'Rojo',
  1: 'Cian / Rojo',
  2: 'Brillo rojo',
  3: 'Rojo'
};
// Same idea for the "glow" slider (uGlow): trunk sparkle brightness in most
// presets, but the cyan halo strength specifically in Ascuas.
const glowLabelByPreset = {
  0: 'Brillos',
  1: 'Brillo troncos',
  2: 'Brillo cian',
  3: 'Brillo troncos'
};
const paramLabels = {
  intensity: 'Rojo',
  darkness: 'Sombra',
  glow: 'Brillos',
  vignette: 'Viñeta',
  grain: 'Ruido'
};

const PRESETS = [
  { id: 0, name: 'Sangre' },
  { id: 1, name: 'Cian/Rojo' },
  { id: 2, name: 'Ascuas' },
  { id: 3, name: 'Amanecer' }
];
let currentPreset = 0;

let currentParam = 'intensity';
const chips = document.querySelectorAll('.chip');
const sliderWrap = document.getElementById('sliderWrap');
const sliderInput = document.getElementById('sliderInput');
const sliderLabel = document.getElementById('sliderLabel');

const presetChips = document.querySelectorAll('.presetChip');
const intensityChipLabel = document.querySelector('.chip[data-param="intensity"]');
const glowChipLabel = document.querySelector('.chip[data-param="glow"]');
presetChips.forEach(chip => {
  chip.addEventListener('click', () => {
    currentPreset = parseInt(chip.dataset.preset, 10);
    presetChips.forEach(c => c.classList.toggle('selected', c === chip));
    // Update the "intensity" and "glow" chip text to match what each
    // actually controls in the newly selected preset.
    paramLabels.intensity = intensityLabelByPreset[currentPreset];
    intensityChipLabel.textContent = intensityLabelByPreset[currentPreset];
    paramLabels.glow = glowLabelByPreset[currentPreset];
    glowChipLabel.textContent = glowLabelByPreset[currentPreset];
    if(currentParam === 'intensity' || currentParam === 'glow'){
      sliderLabel.textContent = paramLabels[currentParam];
    }
  });
});

function selectParam(p){
  currentParam = p;
  chips.forEach(c => c.classList.toggle('selected', c.dataset.param === p));
  sliderLabel.textContent = paramLabels[p];
  sliderInput.value = Math.round(params[p] * 100);
  sliderWrap.classList.add('show');
}
chips.forEach(chip => {
  chip.addEventListener('click', () => selectParam(chip.dataset.param));
});
sliderInput.addEventListener('input', () => {
  params[currentParam] = sliderInput.value / 100;
});
selectParam('intensity');

// ---------- Resize ----------
function resizeCanvas(){
  // Cap at 1.5x instead of 2x: the shader does several texture samples and
  // noise evaluations per pixel, so total pixel count matters a lot for
  // frame rate on mid/low-end Android GPUs. 1.5x keeps things sharp enough
  // while meaningfully cutting the per-frame workload.
  const dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  canvas.width = window.innerWidth * dpr;
  canvas.height = window.innerHeight * dpr;
  gl.viewport(0, 0, canvas.width, canvas.height);
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ---------- Render loop ----------
let startTime = performance.now();
function render(){
  const video = activeVideo;
  if(video.readyState >= video.HAVE_CURRENT_DATA && video.videoWidth > 0){
    gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, video);

    gl.useProgram(program);
    gl.uniform1i(uTex, 0);
    gl.uniform1f(uTime, (performance.now() - startTime) / 1000);
    gl.uniform1f(uIntensity, params.intensity);
    gl.uniform1f(uDarkness, params.darkness);
    gl.uniform1f(uGlow, params.glow);
    gl.uniform1f(uVignette, params.vignette);
    gl.uniform1f(uGrain, params.grain);
    gl.uniform1f(uPreset, currentPreset);
    gl.uniform2f(uResolution, canvas.width, canvas.height);

    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

// ---------- Camera ----------
let currentFacing = 'environment';
let currentStream = null;
let torchOn = false;
const torchBtn = document.getElementById('torchBtn');

async function startCamera(facing){
  try{
    if(currentStream){
      currentStream.getTracks().forEach(t => t.stop());
    }
    hint.textContent = 'Iniciando cámara…';
    hint.classList.add('show');
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    currentStream = stream;
    srcVideo.srcObject = stream;
    await srcVideo.play();
    hint.classList.remove('show');

    // Torch (flash) is only ever available on the rear camera, and only on
    // some devices — check capabilities and show/hide the button accordingly,
    // resetting state since a fresh stream always starts with torch off.
    // IMPORTANT: getCapabilities() can report an empty/incomplete object if
    // queried immediately — the camera hardware needs a brief moment after
    // streaming starts before it reliably exposes torch support. A short
    // delay here avoids the flash button failing to appear on some phones.
    torchOn = false;
    torchBtn.classList.remove('active');
    torchBtn.style.display = 'none';
    const track = stream.getVideoTracks()[0];
    setTimeout(() => {
      if(currentStream !== stream) return; // camera was switched again meanwhile
      const capabilities = track.getCapabilities ? track.getCapabilities() : {};
      torchBtn.style.display = capabilities.torch ? 'flex' : 'none';
    }, 400);
  }catch(err){
    hint.textContent = 'No se pudo acceder a la cámara: ' + err.message;
    hint.classList.add('show');
    console.error(err);
  }
}
startCamera(currentFacing);

document.getElementById('flipBtn').addEventListener('click', () => {
  currentFacing = currentFacing === 'environment' ? 'user' : 'environment';
  startCamera(currentFacing);
});

torchBtn.addEventListener('click', async () => {
  if(!currentStream) return;
  const track = currentStream.getVideoTracks()[0];
  if(!track) return;
  const next = !torchOn;
  try{
    await track.applyConstraints({ advanced: [{ torch: next }] });
    torchOn = next;
    torchBtn.classList.toggle('active', torchOn);
  }catch(err){
    // Some devices report torch capability but reject the constraint —
    // fail quietly rather than breaking the rest of the UI.
    console.error('Torch error:', err);
  }
});

// ---------- Photo / Video capture (from live camera) ----------
const shutterBtn = document.getElementById('shutterBtn');
const videoBtn = document.getElementById('videoBtn');
const recIndicator = document.getElementById('recIndicator');
const recTime = document.getElementById('recTime');

let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;
let recStartTime = 0;
let recTimerInterval = null;

// Resolve the supported codec once at load time instead of re-querying
// MediaRecorder.isTypeSupported() on every recording start — that lookup
// can be slow on some Android WebViews and was causing a visible stutter
// right when you tapped record.
// MP4 (H.264) is tried first since it's far more widely compatible for
// sharing/playback than WebM — falls back to WebM automatically on
// browsers that don't support MP4 muxing in MediaRecorder yet.
const SUPPORTED_MIME_TYPE = (() => {
  const candidates = [
    'video/mp4;codecs=avc1',
    'video/mp4',
    'video/webm;codecs=vp9',
    'video/webm;codecs=vp8',
    'video/webm'
  ];
  for(const m of candidates){
    if(MediaRecorder.isTypeSupported(m)) return m;
  }
  return 'video/webm';
})();
const OUTPUT_EXTENSION = SUPPORTED_MIME_TYPE.startsWith('video/mp4') ? 'mp4' : 'webm';
const OUTPUT_BLOB_TYPE = SUPPORTED_MIME_TYPE.startsWith('video/mp4') ? 'video/mp4' : 'video/webm';

function getCanvasStream(){
  return canvas.captureStream(30);
}

function startRecording(){
  if(isRecording) return;
  recordedChunks = [];
  const canvasStream = getCanvasStream();
  mediaRecorder = new MediaRecorder(canvasStream, { mimeType: SUPPORTED_MIME_TYPE, videoBitsPerSecond: 6000000 });
  mediaRecorder.ondataavailable = e => { if(e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(recordedChunks, { type: OUTPUT_BLOB_TYPE });
    const url = URL.createObjectURL(blob);
    offerDownload(url, 'bosque-rojo-' + Date.now() + '.' + OUTPUT_EXTENSION);
  };
  mediaRecorder.start();
  isRecording = true;
  shutterBtn.classList.add('recording');
  videoBtn.classList.add('recording');
  videoBtn.textContent = '■';
  recIndicator.classList.add('active');
  recStartTime = Date.now();
  recTimerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - recStartTime)/1000);
    const mm = String(Math.floor(s/60)).padStart(2,'0');
    const ss = String(s%60).padStart(2,'0');
    recTime.textContent = mm + ':' + ss;
  }, 250);
}

function stopRecording(){
  if(!isRecording) return;
  mediaRecorder.stop();
  isRecording = false;
  shutterBtn.classList.remove('recording');
  videoBtn.classList.remove('recording');
  videoBtn.textContent = '●';
  recIndicator.classList.remove('active');
  clearInterval(recTimerInterval);
  recTime.textContent = '00:00';
}

function takePhoto(){
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    offerDownload(url, 'bosque-rojo-' + Date.now() + '.png');
  }, 'image/png');
}

shutterBtn.addEventListener('click', () => {
  if(usingFileSource) return; // no photo snap while previewing imported file
  if(isRecording) return; // avoid accidental snap mid-recording
  takePhoto();
});

videoBtn.addEventListener('click', () => {
  if(usingFileSource) return;
  if(isRecording){
    stopRecording();
  }else{
    startRecording();
  }
});

function offerDownload(url, filename){
  const importBar = document.getElementById('importBar');
  const status = document.getElementById('importStatus');
  const progress = document.getElementById('exportProgress');
  const dl = document.getElementById('downloadLink');
  const closeBtn = document.getElementById('closeImportBtn');
  const cancelBtn = document.getElementById('cancelImport');

  importBar.classList.add('show');
  status.textContent = 'Listo.';
  progress.style.display = 'none';
  cancelBtn.style.display = 'none';
  dl.href = url;
  dl.download = filename;
  dl.style.display = 'inline-block';
  closeBtn.style.display = 'inline-block';
}

// ---------- Import & process existing video ----------
const importBtn = document.getElementById('importBtn');
const fileInput = document.getElementById('fileInput');
const importBar = document.getElementById('importBar');
const importStatus = document.getElementById('importStatus');
const exportProgress = document.getElementById('exportProgress');
const exportProgressFill = document.getElementById('exportProgressFill');
const downloadLink = document.getElementById('downloadLink');
const closeImportBtn = document.getElementById('closeImportBtn');
const cancelImportBtn = document.getElementById('cancelImport');

importBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if(!file) return;

  importBar.classList.add('show');
  importStatus.textContent = 'Cargando video…';
  exportProgress.style.display = 'block';
  exportProgressFill.style.width = '0%';
  downloadLink.style.display = 'none';
  closeImportBtn.style.display = 'none';
  cancelImportBtn.style.display = 'inline-block';

  const url = URL.createObjectURL(file);
  fileVideo.src = url;
  await new Promise(res => { fileVideo.onloadedmetadata = res; });

  usingFileSource = true;
  activeVideo = fileVideo;

  const duration = fileVideo.duration;
  importStatus.textContent = 'Procesando video con el filtro…';

  const canvasStream = getCanvasStream();

  const chunks = [];
  const rec = new MediaRecorder(canvasStream, { mimeType: SUPPORTED_MIME_TYPE, videoBitsPerSecond: 8000000 });
  rec.ondataavailable = e => { if(e.data.size > 0) chunks.push(e.data); };

  let cancelled = false;
  cancelImportBtn.onclick = () => {
    cancelled = true;
    rec.stop();
    fileVideo.pause();
    resetImportUI();
  };

  rec.onstop = () => {
    if(cancelled) return;
    const blob = new Blob(chunks, { type: OUTPUT_BLOB_TYPE });
    const outUrl = URL.createObjectURL(blob);
    importStatus.textContent = 'Listo.';
    exportProgress.style.display = 'none';
    cancelImportBtn.style.display = 'none';
    downloadLink.href = outUrl;
    downloadLink.download = 'bosque-rojo-' + Date.now() + '.' + OUTPUT_EXTENSION;
    downloadLink.style.display = 'inline-block';
    closeImportBtn.style.display = 'inline-block';
  };

  fileVideo.currentTime = 0;
  fileVideo.muted = true;
  await fileVideo.play();
  rec.start();

  const progressInterval = setInterval(() => {
    const pct = Math.min(100, (fileVideo.currentTime / duration) * 100);
    exportProgressFill.style.width = pct + '%';
  }, 100);

  fileVideo.onended = () => {
    clearInterval(progressInterval);
    exportProgressFill.style.width = '100%';
    rec.stop();
  };
});

function resetImportUI(){
  importBar.classList.remove('show');
  usingFileSource = false;
  activeVideo = srcVideo;
  fileInput.value = '';
}
closeImportBtn.addEventListener('click', resetImportUI);

// ---------- PWA install hint ----------
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const toast = document.getElementById('installToast');
  toast.classList.add('show');
  toast.addEventListener('click', async () => {
    toast.classList.remove('show');
    if(deferredPrompt){
      deferredPrompt.prompt();
      await deferredPrompt.userChoice;
      deferredPrompt = null;
    }
  });
  setTimeout(() => toast.classList.remove('show'), 6000);
});

// ---------- Service worker registration ----------
if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW error', err));
  });
}
</script>
